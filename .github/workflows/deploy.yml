name: Deploy

# Tag a release (git tag v1.2.3 && git push --tags) to build images and roll them out to the host.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: backend
            name: sql-analyst-backend
          - context: frontend
            name: sql-analyst-web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: SITE_URL=https://${{ vars.SITE_ADDRESS }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      # The host keeps /opt/sql-analyst (a checkout of this repo) and its own .env with secrets.
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/sql-analyst
            git fetch --tags --quiet && git checkout --quiet "${{ github.ref_name }}"
            export IMAGE_TAG="${{ github.ref_name }}" GHCR_OWNER="${{ github.repository_owner }}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --quiet
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
            curl -fsS "https://${{ vars.SITE_ADDRESS }}/api/ready" > /dev/null
